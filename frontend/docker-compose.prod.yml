version: "3.9"

services:
  # Aplicación Next.js (Producción) — expuesta vía Traefik
  luxviajes-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_NODE_ENV=${NEXT_PUBLIC_NODE_ENV:-production}
        - NEXT_PUBLIC_DATAFAST_BASE_URL=${NEXT_PUBLIC_DATAFAST_BASE_URL:-https://eu-prod.oppwa.com}
        - PAYMENTS_BACKEND_URL=${PAYMENTS_BACKEND_URL:-http://backend:3001}
    container_name: luxviajes-app
    restart: unless-stopped
    ports:
      # Solo localhost del host (mismo patrón que cms-luxviajes y n8n)
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    labels:
      - "traefik.enable=true"

      # Router HTTPS (dominio principal + www)
      - "traefik.http.routers.luxviajes.rule=Host(`${DOMAIN:-agencialuxviajes.com}`) || Host(`www.${DOMAIN:-agencialuxviajes.com}`)"
      - "traefik.http.routers.luxviajes.entrypoints=websecure"
      - "traefik.http.routers.luxviajes.tls=true"
      - "traefik.http.routers.luxviajes.tls.certresolver=${CERT_RESOLVER:-le}"
      - "traefik.http.services.luxviajes.loadbalancer.server.port=3000"

      # Redirección HTTP -> HTTPS
      - "traefik.http.routers.luxviajes-http.rule=Host(`${DOMAIN:-agencialuxviajes.com}`) || Host(`www.${DOMAIN:-agencialuxviajes.com}`)"
      - "traefik.http.routers.luxviajes-http.entrypoints=web"
      - "traefik.http.routers.luxviajes-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    networks:
      - luxviajes-network
      - traefik-proxy

  # Monitoreo con Prometheus (Opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: luxviajes-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - luxviajes-network
    profiles:
      - monitoring

  # Logs con Loki (Opcional)
  loki:
    image: grafana/loki:latest
    container_name: luxviajes-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - luxviajes-network
    profiles:
      - monitoring

  # Visualización con Grafana (Opcional)
  grafana:
    image: grafana/grafana:latest
    container_name: luxviajes-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - luxviajes-network
    profiles:
      - monitoring

networks:
  # Red interna compartida con el backend (backend/docker-compose.yml)
  luxviajes-network:
    name: luxviajes-network
    driver: bridge

  # Red externa de Traefik (ya existente en tu VPS)
  traefik-proxy:
    name: ${TRAEFIK_NETWORK:-traefik-proxy}
    external: true

volumes:
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-storage:
    driver: local
