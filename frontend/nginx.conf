# Configuración Nginx para Lux Viajes
# Ubicación: /etc/nginx/sites-available/luxviajes
# Crear con: sudo nano /etc/nginx/sites-available/luxviajes
# Habilitar con: sudo ln -s /etc/nginx/sites-available/luxviajes /etc/nginx/sites-enabled/
# Verificar: sudo nginx -t
# Recargar: sudo systemctl reload nginx

# Upstream para el contenedor Docker
upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirigir HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name luxviajes.com www.luxviajes.com;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Servidor HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name luxviajes.com www.luxviajes.com;

    # ==================== SSL ====================
    # Certificados SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/luxviajes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxviajes.com/privkey.pem;

    # SSL Security Headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ==================== Security Headers ====================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:;" always;

    # ==================== Configuración General ====================
    client_max_body_size 20M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Logging
    access_log /var/log/nginx/luxviajes-access.log;
    error_log /var/log/nginx/luxviajes-error.log warn;

    # ==================== Rutas ====================

    # Ruta principal hacia Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        
        # Headers para conexión HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Redirect handling
        proxy_redirect off;
    }

    # ==================== Assets Estáticos ====================
    # Imágenes, CSS, JS - Cache agresivo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 60d;
        proxy_cache_bypass $http_pragma $http_authorization;
        
        # Headers de cache
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Pragma "public" always;
        add_header Expires "Thu, 31 Dec 2099 23:59:59 GMT" always;
        
        expires 365d;
        access_log off;
    }

    # ==================== API Routes ====================
    location /api/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_request_buffering off;
        
        # No cachear API calls
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_pragma $http_authorization;
    }

    # ==================== Seguridad ====================
    # Denegar acceso a archivos ocultos (.git, .env, etc)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a directorios específicos
    location ~ /(node_modules|\.next) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear archivos sensibles
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==================== Health Check ====================
    location /health {
        access_log off;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

