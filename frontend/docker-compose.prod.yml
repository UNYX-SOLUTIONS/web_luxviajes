# ============================================
# Luxviajes Frontend - Producción
# Next.js + Traefik
# ============================================

name: lux-viajes-frontend

services:

  luxviajes-web:
    build:
      context: .
      dockerfile: Dockerfile

      args:
        NODE_ENV: production
        NEXT_PUBLIC_NODE_ENV: production

        NEXT_PUBLIC_DATAFAST_BASE_URL: ${NEXT_PUBLIC_DATAFAST_BASE_URL_PROD:-https://eu-prod.oppwa.com}

        # API pública de Strapi
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://cms.agencialuxviajes.com/api}

        # Dominio público del frontend
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://agencialuxviajes.com}

        # Backend Express PRIVADO
        PAYMENTS_BACKEND_URL: ${PAYMENTS_BACKEND_URL:-http://backend:3001}

    container_name: luxviajes-app
    restart: unless-stopped

    # ========================================
    # Puerto accesible únicamente en el VPS
    # Traefik también accede por Docker
    # ========================================
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

      # ======================================
      # PostgreSQL / Prisma
      # ======================================
      # Mantener únicamente si Next.js
      # todavía utiliza Prisma directamente.
      DATABASE_URL: postgresql://${DB_USER:-luxviajes}:${DB_PASSWORD:?DB_PASSWORD es requerida en .env}@postgres:5432/${DB_NAME:-luxviajes_db}?schema=public

      # ======================================
      # Aplicación
      # ======================================
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerido en .env}

      WEBHOOK_URL: ${WEBHOOK_URL:-}

      # ======================================
      # Backend Express interno
      # ======================================
      PAYMENTS_BACKEND_URL: ${PAYMENTS_BACKEND_URL:-http://backend:3001}

      # ======================================
      # Variables públicas Next.js
      # ======================================
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://cms.agencialuxviajes.com/api}

      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://agencialuxviajes.com}

      NEXT_PUBLIC_DATAFAST_BASE_URL: ${NEXT_PUBLIC_DATAFAST_BASE_URL_PROD:-https://eu-prod.oppwa.com}

    # ========================================
    # Traefik
    # ========================================
    labels:
      - "traefik.enable=true"

      # Importante:
      # Traefik debe utilizar su propia red
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-proxy}"

      # HTTPS
      - "traefik.http.routers.luxviajes.rule=Host(`${DOMAIN:-agencialuxviajes.com}`) || Host(`www.${DOMAIN:-agencialuxviajes.com}`)"
      - "traefik.http.routers.luxviajes.entrypoints=websecure"
      - "traefik.http.routers.luxviajes.tls=true"
      - "traefik.http.routers.luxviajes.tls.certresolver=${CERT_RESOLVER:-le}"

      # Next.js escucha internamente en 3000
      - "traefik.http.services.luxviajes.loadbalancer.server.port=3000"

      # HTTP
      - "traefik.http.routers.luxviajes-http.rule=Host(`${DOMAIN:-agencialuxviajes.com}`) || Host(`www.${DOMAIN:-agencialuxviajes.com}`)"
      - "traefik.http.routers.luxviajes-http.entrypoints=web"

      # HTTP -> HTTPS
      - "traefik.http.routers.luxviajes-http.middlewares=luxviajes-redirect-https"
      - "traefik.http.middlewares.luxviajes-redirect-https.redirectscheme.scheme=https"

    # ========================================
    # Healthcheck
    # ========================================
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => { if (r.statusCode !== 200) throw new Error(r.statusCode) })"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    # ========================================
    # Logs
    # ========================================
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M

    # ========================================
    # Redes
    # ========================================
    networks:
      - luxviajes-network
      - traefik-proxy


# ============================================
# Redes
# ============================================

networks:

  # Compartida con:
  # backend
  # postgres
  luxviajes-network:
    external: true

  # Red existente de Traefik
  traefik-proxy:
    name: ${TRAEFIK_NETWORK:-traefik-proxy}
    external: true